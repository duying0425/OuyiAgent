services:
  ouyi-adapter:
    container_name: ouyi-adapter
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8081
    ports:
      - "${HOST_PORT:-8081}:8081"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8081/healthz')
          .then(r=>{if(!r.ok)process.exit(1)})
          .catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ai-gateway

networks:
  ai-gateway:
    name: ai-gateway
    external: true
